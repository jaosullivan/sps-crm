apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sps-crm-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jaosullivan/sps-crm
    targetRevision: main
    path: deploy/kustomize/overlays/local
  destination:
    name: rancher-desktop
    namespace: cms
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
