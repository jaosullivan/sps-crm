# Requires External Secrets Operator + ClusterSecretStore `aws-secretsmanager`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sps-crm-app
  namespace: sps-crm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: sps-crm-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: sps-crm/prod/app # must match terraform aws_secretsmanager_secret.app name
