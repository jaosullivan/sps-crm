name: SPSCRM
options:
  bundleIdPrefix: com.stpatrickshk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  SPSCRM:
    type: application
    platform: iOS
    sources:
      - path: SPSCRM
        excludes:
          - "Info.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stpatrickshk.spscrm
      PRODUCT_NAME: SPSCRM
      INFOPLIST_FILE: SPSCRM/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: SPS CRM
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - SPSCRMTests
  SPSCRMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SPSCRMTests
    dependencies:
      - target: SPSCRM
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stpatrickshk.spscrm.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SPSCRM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SPSCRM"
      BUNDLE_LOADER: "$(TEST_HOST)"
